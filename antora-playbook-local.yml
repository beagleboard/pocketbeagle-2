# Mainly for testing standalone version of the site.

site:
  title: PocketBeagle 2
  start_page: pocketbeagle-2::index.adoc

content:
  sources:
  - url: .
    start_paths: documentation
    branches: HEAD

ui:
  bundle:
    url: https://github.com/beagleboard/antora-ui-beagle/releases/download/continuous-release/ui-bundle.zip
    snapshot: true

antora:
  extensions:
  - '@antora/pdf-extension'
  - '@antora/lunr-extension'

asciidoc:
  attributes:
    page-pagination: ''
